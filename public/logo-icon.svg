<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#d4b97a"/>
    </linearGradient>
  </defs>
  <!-- Circular border -->
  <circle cx="50" cy="50" r="46" stroke="url(#gold-grad)" stroke-width="1.5" fill="none"/>
  <!-- Letter C stylized -->
  <text x="50" y="65" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="url(#gold-grad)">C</text>
  <!-- Small decorative dots -->
  <circle cx="50" cy="12" r="2" fill="#c9a96e" opacity="0.7"/>
  <circle cx="50" cy="88" r="2" fill="#c9a96e" opacity="0.7"/>
</svg>
