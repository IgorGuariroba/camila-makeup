<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="gold-gradient-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="50%" stop-color="#d4b97a"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="120" fill="#0a0a0a" rx="4"/>
  <!-- Main text -->
  <text x="200" y="55" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="700" fill="url(#gold-gradient-dark)" letter-spacing="3">Camila</text>
  <!-- Subtitle -->
  <text x="200" y="85" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#d4b5a0" letter-spacing="6">MAKEUP ARTIST</text>
  <!-- Decorative lines -->
  <line x1="90" y1="95" x2="160" y2="95" stroke="#c9a96e" stroke-width="0.5" opacity="0.6"/>
  <line x1="240" y1="95" x2="310" y2="95" stroke="#c9a96e" stroke-width="0.5" opacity="0.6"/>
  <!-- Small diamond accent -->
  <polygon points="200,92 203,95 200,98 197,95" fill="#c9a96e" opacity="0.8"/>
</svg>
